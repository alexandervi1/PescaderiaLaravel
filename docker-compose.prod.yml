# Stack de producción para VPS (Oracle) detrás de Cloudflare.
# Uso: docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
name: pescaderia

services:
  app:
    build:
      context: .
      target: prod
    image: pescaderia-laravel:prod
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: deploy/.env.prod
    environment:
      APP_KEY: "${APP_KEY:?define APP_KEY en deploy/.env.prod}"
      APP_URL: "${APP_URL:?define APP_URL en deploy/.env.prod}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      TRUSTED_PROXIES: "*"
    volumes:
      - ./public/img:/var/www/html/public/img
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/salud') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  db:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-pescaderia}"
      MYSQL_USER: "${MYSQL_USER:-pescaderia}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?define MYSQL_PASSWORD en deploy/.env.prod}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en deploy/.env.prod}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
      - "${PROD_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?define APP_DOMAIN en deploy/.env.prod}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  dbdata:
  caddy_data:
  caddy_config:
