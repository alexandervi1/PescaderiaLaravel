; Producción: el código va dentro de la imagen, así que OPcache no necesita
; comprobar timestamps. Cada despliegue reconstruye la imagen y recrea el contenedor.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

display_errors=Off
log_errors=On
expose_php=Off
