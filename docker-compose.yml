name: pescaderia

services:
  app:
    build: .
    image: pescaderia-laravel:local
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    environment:
      APP_NAME: "Pescaderia Don Walter"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "http://localhost:${DOCKER_HTTP_PORT:-8080}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: "${MYSQL_DATABASE:-pescaderia}"
      DB_USERNAME: "${MYSQL_USER:-pescaderia}"
      DB_PASSWORD: "${MYSQL_PASSWORD:-secret}"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      SEED_ON_START: "${SEED_ON_START:-true}"
    volumes:
      - ./public/img:/var/www/html/public/img
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-pescaderia}"
      MYSQL_USER: "${MYSQL_USER:-pescaderia}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
